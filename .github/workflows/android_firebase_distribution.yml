name: Android Build & Firebase App Distribution

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build APK and Distribute to Testers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check Firebase Secrets Availability
        id: check_secrets
        run: |
          if [ -z "${{ secrets.FIREBASE_APP_ID }}" ] || [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "::warning ::Firebase Secrets (FIREBASE_APP_ID / FIREBASE_SERVICE_ACCOUNT_KEY) are missing in GitHub Secrets."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Firebase App Distribution
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: w9jds/firebase-action@v2.2.2
        with:
          args: "appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups testers --release-notes 'Automated build from GitHub Actions'"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
